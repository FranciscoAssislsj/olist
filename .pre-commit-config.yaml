# Hooks rodados a cada `git commit`. Instalação: `uv run pre-commit install`.
# O ruff e o uv vêm do ambiente do projeto (uv.lock), na mesma versão do CI.
exclude: ^(data/raw/|reports/relatorio\.html$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
        # mkdocs.yml usa tags !!python/name do Material.
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --only-group dev ruff check --fix
        language: system
        types: [python]
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
